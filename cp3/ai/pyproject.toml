[project]
name = "lume-documentos"
version = "0.1.0"
description = "Assistente de documentos com contexto longo e roteamento OpenRouter"
requires-python = ">=3.11"
dependencies = ["fastapi==0.119.1", "uvicorn==0.38.0", "httpx==0.28.1", "python-multipart==0.0.20", "pypdf==6.1.3", "python-dotenv==1.1.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
